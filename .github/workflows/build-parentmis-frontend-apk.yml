name: Build ParentMIS Frontend APK

on:
  push:
    branches:
      - main
      - feature/parentApp
      - pwa-app
    paths:
      - '.github/workflows/build-parentmis-frontend-apk.yml'
      - 'ParentMIS/Frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-parentmis-apk:
    name: Build ParentMIS Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Firebase config and build app
        working-directory: ParentMIS/Frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://parents.shuleplus.rw/api' }}
          NEXT_PUBLIC_IAM_API_URL: ${{ secrets.NEXT_PUBLIC_IAM_API_URL || 'https://shuleplus.rw/api/v1' }}
          NEXT_PUBLIC_IAM_URL: ${{ secrets.NEXT_PUBLIC_IAM_URL || 'https://app.shuleplus.rw' }}
          NEXT_PUBLIC_STUDENT_MGMT_API_URL: ${{ secrets.NEXT_PUBLIC_STUDENT_MGMT_API_URL || 'https://studentmanagement-api.shuleplus.rw/api' }}
          NEXT_PUBLIC_FEES_PORTAL_URL: ${{ secrets.NEXT_PUBLIC_FEES_PORTAL_URL || 'https://fees.shuleplus.rw' }}
          NEXT_PUBLIC_PARENT_MIS_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_PARENT_MIS_SOCKET_URL || 'https://parents.shuleplus.rw' }}
          NEXT_PUBLIC_SHULEKIT_API_URL: ${{ secrets.NEXT_PUBLIC_SHULEKIT_API_URL || 'https://materials-api.shuleplus.rw/api' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_APP_VERSION: ${{ vars.NEXT_PUBLIC_APP_VERSION || '1.0.0' }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = {
            apiKey: process.env.NEXT_PUBLIC_FIREBASE_API_KEY || '',
            authDomain: process.env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || '',
            projectId: process.env.NEXT_PUBLIC_FIREBASE_PROJECT_ID || '',
            storageBucket: process.env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || '',
            messagingSenderId: process.env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '',
            appId: process.env.NEXT_PUBLIC_FIREBASE_APP_ID || '',
            measurementId: process.env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || '',
            vapidKey: process.env.NEXT_PUBLIC_FIREBASE_VAPID_KEY || ''
          };
          fs.writeFileSync('public/firebase-config.json', JSON.stringify(config, null, 2));
          NODE
          pnpm build
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap sync android

      - name: Prepare Android app config
        id: prepare
        working-directory: ParentMIS/Frontend/android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
          PARENT_KEYSTORE_BASE64: ${{ secrets.PARENT_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUMBER}/" app/build.gradle
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          if [ -n "$PARENT_KEYSTORE_BASE64" ]; then
            printf '%s' "$PARENT_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "signing_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and stage APK
        working-directory: ParentMIS/Frontend/android
        env:
          SIGNING_AVAILABLE: ${{ steps.prepare.outputs.signing_available }}
          PARENT_KEYSTORE_PASSWORD: ${{ secrets.PARENT_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          PARENT_KEY_ALIAS: ${{ secrets.PARENT_KEY_ALIAS || secrets.KEY_ALIAS }}
          PARENT_KEY_PASSWORD: ${{ secrets.PARENT_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$PARENT_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$PARENT_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$PARENT_KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk-out/yoShule-ParentMIS-release.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-out/yoShule-ParentMIS-debug.apk"
          fi

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: parentmis-fe-build-${{ github.run_number }}
          name: "yoShule ParentMIS Web-to-APK (Build #${{ github.run_number }})"
          body: |
            Automated APK build for yoShule ParentMIS Frontend.
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Run: #${{ github.run_number }}
          files: apk-out/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: yoShule-ParentMIS-apk-${{ github.run_number }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 1
