<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yoShule Parent: Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#13213D;--amber:#F5A623;--bg:#F5F6FA;--card:#FFFFFF;--line:#E8EBF2;--ink:#13213D;--muted:#6B7385;--field:#F5F6FA;--green:#12A06A;--red:#E5484D;--soft:#FFF3DC;--soft-ink:#B26B00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1424;--card:#16213A;--line:#26334F;--ink:#EEF1F8;--muted:#9AA6C0;--field:#0F1A31;--soft:#3A2C0F;--soft-ink:#F5C46B}}
:root[data-theme="dark"]{--bg:#0C1424;--card:#16213A;--line:#26334F;--ink:#EEF1F8;--muted:#9AA6C0;--field:#0F1A31;--soft:#3A2C0F;--soft-ink:#F5C46B}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :focus-visible{outline-color:var(--amber)}}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.logo{height:28px;width:auto;display:block}
.app{min-height:100dvh}
.side{display:none}
.main{padding-bottom:100px}
.mtop{background:var(--navy);display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.avt{width:34px;height:34px;border-radius:50%;background:var(--amber);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:12px}
.dm{max-width:1080px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:22px}
.dhead{display:flex;flex-direction:column;gap:14px}
.dhead small{color:var(--muted);font-size:13px;font-weight:600}.dhead h1{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-top:2px}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:4px;gap:4px;align-self:flex-start}
.seg button{padding:9px 16px;border-radius:12px;font-size:13px;font-weight:700;color:var(--muted)}.seg button.on{background:var(--amber);color:#13213D}
.top2,.cols{display:grid;gap:16px}
.fee{background:linear-gradient(135deg,#13213D,#24396A);color:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 14px 34px rgba(19,33,61,.25)}
.fee small{color:#A9B7D6;font-weight:600;font-size:13px}.big{font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;margin-top:6px}
.prog{height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden}.prog i{display:block;height:100%;background:var(--amber);border-radius:8px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#C9D1E3;margin-top:-6px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;padding:14px 22px;border-radius:14px;transition:transform .15s}.btn:hover{transform:translateY(-1px)}
.btn.amber{background:var(--amber);color:#13213D}.btn.navy{background:var(--navy);color:#fff}.btn.outline{border:1.5px solid var(--line)}.btn.full{width:100%}
.panel{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 8px 24px rgba(19,33,61,.07)}
.wal{display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.wal small{color:var(--muted);font-weight:600;font-size:13px}.wal p{font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
.sec{font-size:16px;font-weight:700;margin-bottom:12px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa button{background:var(--card);border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(19,33,61,.06);transition:transform .15s,box-shadow .15s}
.qa button:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(19,33,61,.12)}
.qa .sq{width:48px;height:48px;border-radius:16px;background:var(--field);display:grid;place-items:center}.qa .sq.am{background:var(--amber);color:#13213D}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(19,33,61,.06)}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:600}.tile b{display:block;font-size:22px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}.tile i{font-style:normal;font-size:11px;font-weight:700;color:var(--green)}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.li{display:flex;gap:14px;align-items:center;padding:14px 0;width:100%;text-align:left}.li+.li{border-top:1px solid var(--line)}
.time{width:48px;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.li div{flex:1;min-width:0}.li b{display:block;font-size:14px}.li .s{font-size:12px;color:var(--muted)}
.pl{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap}
.pl.g{background:rgba(18,160,106,.15);color:var(--green)}.pl.a{background:var(--soft);color:var(--soft-ink)}.pl.m{background:var(--field);color:var(--muted)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.li.done .chk{background:var(--green);border-color:var(--green);color:#fff}.li.done b{text-decoration:line-through;color:var(--muted)}
/* navigation */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:64px;background:var(--navy);border-radius:22px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 12px 30px rgba(19,33,61,.35);z-index:6}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#8D9AB8;width:64px}.nv.on{color:var(--amber)}
.nv em{position:absolute;top:-4px;right:10px;background:var(--amber);color:var(--navy);font-style:normal;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
/* dialog */
dialog{border:0;border-radius:24px;padding:24px;width:min(460px,calc(100% - 24px));background:var(--card);color:var(--ink);margin:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(12,20,36,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dh h2{font-size:20px;font-weight:800;letter-spacing:-.4px}
.x{width:34px;height:34px;border-radius:50%;background:var(--field);font-size:16px}
.f{display:flex;flex-direction:column;gap:14px}.f label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}
.f input,.f select,.f textarea{font-size:15px;font-weight:500;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);width:100%;outline:none}
.f textarea{min-height:90px;resize:vertical}.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,166,35,.2)}
.f p{font-size:13px;line-height:1.6;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){.top2{grid-template-columns:1.6fr 1fr}.cols{grid-template-columns:1.2fr 1fr}.qa{grid-template-columns:repeat(4,1fr)}.dhead{flex-direction:row;justify-content:space-between;align-items:flex-end}}
@media (min-width:900px){
 .app{display:grid;grid-template-columns:240px 1fr}
 .bar,.mtop{display:none}.main{padding-bottom:40px}.toast{bottom:32px}
 .side{display:flex;flex-direction:column;gap:28px;background:var(--navy);padding:28px 16px;position:sticky;top:0;height:100dvh}
 .side .logo{margin-left:10px}.side nav{display:flex;flex-direction:column;gap:6px}
 .side .nv{flex-direction:row;gap:14px;width:100%;font-size:14px;padding:12px 14px;border-radius:14px;color:#9FB0D3}
 .side .nv:hover{background:rgba(255,255,255,.06)}.side .nv.on{background:rgba(245,166,35,.15);color:var(--amber)}
 .side .nv em{position:static;margin-left:auto;order:3}
 .lo{margin-top:auto;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;color:#9FB0D3}.lo:hover{background:rgba(255,255,255,.06)}
 .dm{padding:36px 40px 40px}.big{font-size:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

          <div><small>Fees due · Term 3</small><div class="big" id="due"></div></div>
          <div class="prog"><i id="pct"></i></div><div class="meta" id="meta"></div>
          <button class="btn amber" data-toast="Pay fees: the payment flow opens here.">Pay fees</button>
        </section>
        <section class="panel wal">
          <div><small>ShuleCard balance</small><div class="big" id="card"></div><p id="spent"></p></div>
          <button class="btn outline" data-toast="Top up card: the top-up flow opens here.">Top up card</button>

      </div>
      <section><h2 class="sec">Quick actions</h2><div class="qa" id="qa"></div></section>
      <div class="tiles">
        <div class="tile"><small>Attendance</small><b id="att"></b><i>This term</i></div>
        <div class="tile"><small>Average</small><b id="avg"></b><i id="dlt"></i></div>
        <div class="tile"><small>Homework</small><b id="hw"></b><i>Due soon</i></div>
      </div>
      <div class="cols">
        <section class="panel"><h2>Today in class</h2><div id="classes"></div></section>
        <section class="panel"><h2>To do</h2><div id="todos"></div></section>

<dialog id="dlg" aria-labelledby="dt"><div class="dh"><h2 id="dt"></h2><button class="x" id="dx" aria-label="Close">✕</button></div><div id="db"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)}, tt;
var P={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',learn:'M22 10 12 5 2 10l10 5 10-5zM6 12v5c3 3 9 3 12 0v-5',pay:'M3 6h18v12H3zM3 10h18',kit:'M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2M3 7h18v14H3zM3 12h18',chat:'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
 cal:'M4 5h16v16H4zM4 10h16M9 3v4M15 3v4',doc:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6',bus:'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 11h16M7.5 18v2M16.5 18v2'};
var ic=function(k){return '<svg viewBox="0 0 24 24"><path d="'+P[k]+'"/></svg>'};
var NAV=[['home','Home'],['learn','Learning'],['pay','Pay',2],['kit','ShuleKit'],['chat','Chat',3]];
var navHtml=NAV.map(function(n){return '<button class="nv'+(n[0]==='home'?' on':'')+'" data-nav="'+n[1]+'">'+(n[2]?'<em>'+n[2]+'</em>':'')+ic(n[0])+n[1]+'</button>'}).join('');
$('sideNav').innerHTML=navHtml;$('barNav').innerHTML=navHtml;
var QA=[['abs','cal','Report absence',1],['msg','chat','Message teacher'],['bby','doc','Get Babyeyi'],['trip','bus','School trips']];
$('qa').innerHTML=QA.map(function(q){return '<button data-q="'+q[0]+'"><span class="sq'+(q[3]?' am':'')+'">'+ic(q[1])+'</span>'+q[2]+'</button>'}).join('');

var D={
 keza:{n:'Keza',cls:'S4',teacher:'Eric Nkurunziza',billed:940000,due:360000,card:8450,spent:6200,att:'97.1%',avg:'71.4%',dlt:'▲ 4.6 pts',hw:2,
  classes:[['07:30','Mathematics','Eric Nkurunziza','Done'],['10:00','Physics practical','Claude Ntwari','Now'],['13:20','English','Peace Umuhoza','Next']],
  todos:[{t:'Pay the Term 3 balance',s:'RWF 360,000 · 41 days overdue'},{t:'Reply to Sports Day invitation',s:'Saturday 7 Nov'},{t:'Request ShuleKit for Term 1 2027',s:'Closes 15 Nov'}]},
 ganza:{n:'Ganza',cls:'S2',teacher:'Jeanne Mukamurenzi',billed:700000,due:200000,card:2300,spent:3100,att:'94.2%',avg:'64.2%',dlt:'▲ 0.7 pts',hw:1,
  classes:[['08:20','Mathematics','Jeanne Mukamurenzi','Done'],['09:10','French','Yvonne Ishimwe','Now'],['11:30','PE and Sports','Eric Mugenzi','Next']],
  todos:[{t:'Pay the Term 3 balance',s:'RWF 200,000 due'},{t:'Top up ShuleCard',s:'Balance is below RWF 3,000'},{t:'Learn the French word list',s:'Due Friday'}]}
}, cur='keza', R=function(n){return 'RWF '+n.toLocaleString('en-US')};

function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}
function render(){
  var c=D[cur], d=new Date(), h=d.getHours();
  $('date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+' · Term 3, Week 8';
  $('greet').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', Claire';
  $('seg').innerHTML=Object.keys(D).map(function(k){return '<button role="tab" aria-selected="'+(k===cur)+'" class="'+(k===cur?'on':'')+'" data-k="'+k+'">'+D[k].n+'</button>'}).join('');
  var pct=Math.round((c.billed-c.due)/c.billed*100);
  $('due').textContent=R(c.due);$('pct').style.width=pct+'%';$('meta').innerHTML='<span>'+pct+'% paid</span><span>of '+R(c.billed)+'</span>';
  $('card').textContent=R(c.card);$('spent').textContent='Spent this week: '+R(c.spent);
  $('att').textContent=c.att;$('avg').textContent=c.avg;$('dlt').textContent=c.dlt;$('hw').textContent=c.hw;
  $('classes').innerHTML=c.classes.map(function(x){return '<div class="li"><span class="time">'+x[0]+'</span><div><b>'+x[1]+'</b><span class="s">'+x[2]+'</span></div><span class="pl '+(x[3]==='Now'?'a':x[3]==='Done'?'g':'m')+'">'+x[3]+'</span></div>'}).join('');
  $('todos').innerHTML=c.todos.map(function(x,i){return '<button class="li'+(x.done?' done':'')+'" data-i="'+i+'"><span class="chk">✓</span><div><b>'+x.t+'</b><span class="s">'+x.s+'</span></div></button>'}).join('');
}
function openDlg(q){
  var c=D[cur], today=new Date().toISOString().slice(0,10), t, b, ok;
  if(q==='abs'){t='Report absence';ok='Absence reported for '+c.n;
    b='<form class="f" data-ok="'+ok+'"><label>Date<input type="date" value="'+today+'" required></label><label>Reason<select><option>Sick</option><option>Medical appointment</option><option>Family matter</option><option>Other</option></select></label><label>Note for the class teacher<textarea placeholder="Optional"></textarea></label><button class="btn navy full">Send report</button></form>'}
  if(q==='msg'){t='Message teacher';ok='Message sent to '+c.teacher;
    b='<form class="f" data-ok="'+ok+'"><label>To<select><option>'+c.teacher+' · class teacher</option>'+c.classes.map(function(x){return '<option>'+x[2]+' · '+x[1]+'</option>'}).join('')+'</select></label><label>Message<textarea placeholder="Write your message" required></textarea></label><button class="btn navy full">Send message</button></form>'}
  if(q==='bby'){t='Get Babyeyi';ok='Babyeyi for '+c.n+' is ready to download';
    b='<form class="f" data-ok="'+ok+'"><p>The Babyeyi lists the fees and school requirements for '+c.n+' ('+c.cls+') next term.</p><button class="btn navy full">Download Babyeyi</button></form>'}
  if(q==='trip'){t='School trips';
    b='<div class="f"><div class="li"><div><b>Volcanoes National Park</b><span class="s">Sat 14 Nov · RWF 45,000</span></div><button class="btn amber" data-ok="'+c.n+' joined the Volcanoes trip">Join</button></div><div class="li"><div><b>Kigali museum visit</b><span class="s">Sat 28 Nov · RWF 8,000</span></div><button class="btn amber" data-ok="'+c.n+' joined the museum visit">Join</button></div></div>'}
  $('dt').textContent=t;$('db').innerHTML=b;$('dlg').showModal();
}
$('seg').onclick=function(e){var k=e.target.getAttribute('data-k');if(k){cur=k;render()}};
$('todos').onclick=function(e){var b=e.target.closest('[data-i]');if(b){var x=D[cur].todos[+b.getAttribute('data-i')];x.done=!x.done;render()}};
$('qa').onclick=function(e){var b=e.target.closest('[data-q]');if(b)openDlg(b.getAttribute('data-q'))};
$('dx').onclick=function(){$('dlg').close()};
$('dlg').addEventListener('click',function(e){if(e.target===this)this.close()});
$('db').addEventListener('submit',function(e){e.preventDefault();var m=e.target.getAttribute('data-ok');$('dlg').close();toast(m)});
$('db').addEventListener('click',function(e){var m=e.target.getAttribute&&e.target.getAttribute('data-ok');if(m&&e.target.tagName==='BUTTON'&&!e.target.closest('form')){$('dlg').close();toast(m)}});
document.querySelectorAll('[data-toast]').forEach(function(b){b.onclick=function(){toast(b.getAttribute('data-toast'))}});
document.querySelectorAll('[data-nav]').forEach(function(b){b.onclick=function(){var n=b.getAttribute('data-nav');if(n!=='Home')toast(n+' page comes next.')}});
render();
})();
</script>
