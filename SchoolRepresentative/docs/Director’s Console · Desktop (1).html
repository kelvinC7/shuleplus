<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Director’s Console · Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#13213D;--navy2:#1B2D52;--amber:#F5A623;--amber-s:#FFF3DC;--bg:#F4F5F8;--card:#fff;--line:#E5E8EF;--muted:#6B7385;--text:#111827;--green:#1FA971;--red:#E5484D;--blue:#3E7BFA;--hover:#F0F2F7;--bar:#1B2D52;--shadow:0 1px 2px rgba(19,33,61,.06),0 8px 24px rgba(19,33,61,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#121C33;--line:#223152;--muted:#92A0BF;--text:#E8ECF5;--hover:#1A2644;--amber-s:#3a2a08;--bar:#3E7BFA;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#121C33;--line:#223152;--muted:#92A0BF;--text:#E8ECF5;--hover:#1A2644;--amber-s:#3a2a08;--bar:#3E7BFA;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.45;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
aside{background:var(--navy);color:#C9D1E3;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--amber);color:var(--navy);display:grid;place-items:center;font-weight:800}
.brand b{color:#fff;font-size:14px;display:block;line-height:1.2}.brand small{font-size:11px;color:#8D9AB8}
.sec{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#6F7EA0;margin:14px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:10px;color:#C9D1E3;font-weight:500;text-align:left}
.nav:hover{background:rgba(255,255,255,.06)}.nav.on{background:rgba(245,166,35,.14);color:var(--amber)}
.nav em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:var(--amber);color:var(--navy);border-radius:20px;padding:1px 8px}
.sos{margin-top:auto;background:rgba(229,72,77,.14);color:#FF8B8F;border:1px solid rgba(229,72,77,.4);border-radius:12px;padding:11px;display:flex;gap:8px;align-items:center;justify-content:center;font-weight:700}
.sos:hover{background:var(--red);color:#fff}
main{min-width:0;padding:0 28px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:14px;align-items:center;padding:16px 0;background:var(--bg)}
.search{flex:1;max-width:520px;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:var(--muted)}
.search input{flex:1;outline:0;cursor:text;min-width:0}.search kbd{font:600 11px 'Montserrat',sans-serif;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.sp{flex:1}.sel,.ib{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;gap:8px;align-items:center;font-weight:600}
select.sel{appearance:none}.ib{padding:9px;position:relative}.ib i{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.me{display:flex;gap:10px;align-items:center}.av{width:38px;height:38px;border-radius:50%;background:var(--navy2);color:var(--amber);display:grid;place-items:center;font-weight:700;border:2px solid var(--amber)}.me small{display:block;color:var(--muted);font-size:11px}
.pg{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 18px;gap:16px}
.pg small{color:var(--amber);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:11px}.pg h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.2}.pg p{color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:linear-gradient(120deg,var(--navy),var(--navy2) 70%);color:#fff;border-radius:20px;padding:26px 30px;margin:6px 0 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,.28),transparent 65%)}
.hero small{color:#9FB0D6;font-weight:600}.hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:2px 0 6px}.hero p{max-width:560px;color:#C9D1E3;font-size:14px}.hero p b{color:var(--amber)}
.acts{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1}
.btn{border-radius:10px;padding:9px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center}.btn.p{background:var(--amber);color:var(--navy)}.btn.g{background:rgba(255,255,255,.12);color:#fff}.btn.o{background:var(--hover)}.btn:hover{filter:brightness(1.08)}
.ring{position:relative;width:132px;height:132px;z-index:1}.ring svg{width:132px;height:132px;stroke-width:10;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font-size:34px;font-weight:800;line-height:1}.ring span{font-size:10px;letter-spacing:1.5px;color:#9FB0D6;font-weight:600}
.grid{display:grid;gap:18px;margin-bottom:18px}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.split{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.kpi{display:flex;flex-direction:column;gap:2px;transition:.15s;text-align:left}.kpi:hover{transform:translateY(-2px);border-color:var(--amber)}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px;background:var(--hover)}.kpi small{color:var(--muted);font-weight:600}.kpi b{font-size:24px;font-weight:800;letter-spacing:-.5px}.kpi em{font-style:normal;font-size:12px;font-weight:600}
.g{color:var(--green)}.a{color:#C77D00}.r{color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .a{color:var(--amber)}}
:root[data-theme="dark"] .a{color:var(--amber)}
.h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}.h h3{font-size:15px;font-weight:700}.h>span{color:var(--muted);font-size:12px}
.chip{border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;background:var(--hover);color:var(--muted);white-space:nowrap}
.chip.g{background:rgba(31,169,113,.14);color:var(--green)}.chip.a{background:var(--amber-s);color:#9A5B00}.chip.r{background:rgba(229,72,77,.14);color:var(--red)}
:root[data-theme="dark"] .chip.a{color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.a{color:var(--amber)}}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:default}.row:first-of-type{border-top:0}
.row.sl{cursor:pointer;padding:12px;border-radius:12px;border:1px solid transparent;margin-bottom:4px}.row.sl:hover{background:var(--hover)}.row.sl.on{border-color:var(--amber);background:var(--amber-s)}
.tag{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:11px;background:var(--hover)}
.row b{display:block;font-size:13px}.row small{color:var(--muted);display:block}
.bt{display:flex;gap:6px;align-items:center}.amt{font-weight:700;margin-right:6px}
.ok,.no{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}.ok{background:rgba(31,169,113,.14);color:var(--green)}.ok:hover{background:var(--green);color:#fff}.no{background:rgba(229,72,77,.12);color:var(--red)}.no:hover{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.tl{list-style:none}.tl li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0}.tl time{font-weight:700;color:var(--muted);font-size:12px}.tl li div{border-left:3px solid var(--amber);padding-left:12px}.tl li.r div{border-color:var(--red)}.tl li.b div{border-color:var(--blue)}.tl small{color:var(--muted);display:block}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.c{cursor:pointer}tbody tr:hover{background:var(--hover)}tr:last-child td{border-bottom:0}.nm b{display:block}.nm small{color:var(--muted)}
.bar{height:7px;border-radius:6px;background:var(--hover);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;border-radius:6px}
.hl{display:inline-grid;place-items:center;width:38px;height:26px;border-radius:8px;font-weight:800;color:#fff}
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars i{width:100%;max-width:46px;border-radius:8px 8px 4px 4px;background:var(--bar)}.bars div.hi i{background:var(--amber)}.bars em{font-style:normal;font-weight:700;font-size:12px}.bars small{color:var(--muted)}
.hb{margin-bottom:12px}.hb .r2{display:flex;justify-content:space-between;font-weight:600;margin-bottom:5px}.hb .r2 span:last-child{color:var(--muted);font-weight:500}
.hb .t{position:relative;height:9px;border-radius:6px;background:var(--hover)}.hb .t i{display:block;height:100%;border-radius:6px;background:var(--bar)}.hb .t s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--amber)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--navy);color:#fff}
.seg.f{flex-wrap:wrap;margin-bottom:14px}
/* live */
.cams{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cam{aspect-ratio:16/10;border-radius:12px;position:relative;overflow:hidden;color:#fff;text-align:left;padding:10px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid transparent}
.cam.on{border-color:var(--amber)}.cam small{font-size:11px;opacity:.8}.cam b{font-size:12px;display:block}
.cam i{position:absolute;top:10px;right:10px;font:700 10px 'Montserrat';font-style:normal;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:20px}.cam i:before{content:"● ";color:#FF5A5F}.cam.off i:before{color:#888}
.view{aspect-ratio:16/8;border-radius:14px;position:relative;margin-bottom:12px;color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#24396A,#0B1220);overflow:hidden}
.view:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px);pointer-events:none}
.view .acts{margin:0}
.route{height:6px;border-radius:6px;background:var(--hover);position:relative;margin-top:6px}.route i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{border-radius:12px;padding:12px;text-align:left;border:1px solid var(--line);background:var(--hover)}.tile b{display:block}.tile small{color:var(--muted);font-size:11px}
.tile.cov{border-color:var(--blue)}.tile.gap{border-color:var(--red);background:rgba(229,72,77,.1)}.tile.exam{border-color:var(--amber)}.tile:hover{filter:brightness(1.05)}
/* approvals detail */
.steps{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.step{display:flex;gap:8px;align-items:center;padding:6px 12px;border-radius:20px;background:var(--hover);color:var(--muted);font-weight:600;font-size:12px}.step.ok2{background:rgba(31,169,113,.14);color:var(--green)}.step.me2{background:var(--amber);color:var(--navy)}
.det h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:8px 0}.det p{color:var(--muted);margin-bottom:6px}.det .big{font-size:28px;font-weight:800;margin:10px 0}
.det .acts{margin-top:18px}.det .btn.p{background:var(--green);color:#fff}.det .btn.o.rj{color:var(--red)}
/* modules */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.mod{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;transition:.15s}.mod:hover{transform:translateY(-2px);border-color:var(--amber)}
.mod .mi{width:40px;height:40px;border-radius:12px;background:var(--hover);display:grid;place-items:center;flex-shrink:0}.mod b{display:block}.mod small{color:var(--muted)}
.mod .st{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--green)}.mod .st.w{background:var(--amber)}
.fld{display:block;margin-bottom:12px}.fld span{display:block;font-weight:600;margin-bottom:5px;font-size:12px;color:var(--muted)}
.fld select,.fld textarea{width:100%;background:var(--hover);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}.fld textarea{min-height:90px;resize:vertical;cursor:text}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1180px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.cols,.two,.split{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){body{grid-template-columns:1fr}aside{display:none}.hero{grid-template-columns:1fr}main{padding:0 16px 32px}.k3{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">SM</div><div><b>St Matthew’s Schools</b><small>Director’s Console</small></div></div>
  <nav id="nav"></nav>
  <button class="sos" onclick="toast('Emergency alert needs confirmation')"><svg viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>Emergency alert</button>
</aside>
<main>
  <header class="top">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Search a page, e.g. fees, buses, circulars…"><kbd>Ctrl K</kbd></label>
    <div class="sp"></div>
    <select class="sel" id="scope" aria-label="School"><option value="all">All 6 schools</option></select>
    <button class="sel" id="theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ib" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><i></i></button>
    <div class="me"><div class="av">JM</div><div><b>Mr. Muramira</b><small>Group Director</small></div></div>
  </header>
  <div id="app"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)};
const I=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const IC={home:'<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',ap:'<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',live:'<path d="M23 7l-7 5 7 5zM1 5h15v14H1z"/>',chart:'<path d="M18 20V10M12 20V4M6 20v-6"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5zM20 17v5H6.5A2.5 2.5 0 0 1 4 19.5"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',box:'<path d="M21 16V8l-9-5-9 5v8l9 5z"/>',globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/>',user:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>',bus:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M3 11h18M7 20v-3M17 20v-3"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',map:'<path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4z"/>',coffee:'<path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4zM6 1v3M10 1v3M14 1v3"/>'};
const BR=[{id:'KM',n:'Kamembe Main',l:'Nursery & Primary · Day',s:920,p:891,f:81,a:44,t:46,h:93,c:'g',note:'All classes teaching'},{id:'KN',n:'Kamembe N&P',l:'Nursery & Primary · Day',s:540,p:516,f:74,a:27,t:28,h:90,c:'a',note:'24 learners absent'},{id:'KS',n:'Kamembe Secondary',l:'O-Level · Boarding',s:610,p:602,f:69,a:38,t:41,h:86,c:'r',note:'S2B Chemistry: no teacher'},{id:'GA',n:'Gashonga',l:'Nursery & Primary · Day',s:310,p:287,f:63,a:17,t:17,h:84,c:'a',note:'74 families owe fees'},{id:'NY',n:'Nyamasheke',l:'Nursery & Primary · Day',s:470,p:452,f:77,a:23,t:24,h:91,c:'g',note:'All classes teaching'},{id:'NT',n:'Ntendezi',l:'Day & boarding',s:280,p:259,f:58,a:15,t:16,h:80,c:'r',note:'Lowest fees in group'}];
const AP=[
{id:1,k:'Circular',tg:'CI',t:'Babyeyi: Term 1 2027 fees and requirements',w:'Claudine N., Secretary',d:'Due today',x:'Prepared by the group secretary. Goes to all 3,130 families in the 6 schools once approved.',st:[['Accountant',1],['Director',2],['District'],['NESA']]},
{id:2,k:'Procurement',tg:'PO',t:'PO #214 · Laboratory reagents for S3 practicals',w:'Dr. Mukamana, Head of Science',d:'Due today',amt:'RWF 1,460,000',x:'Lowest of 3 quotations. Within the science budget line.',st:[['Head of Science',1],['Director',2]]},
{id:3,k:'Leave',tg:'LV',t:'Ms. Uwase · 2 days’ leave, 28–29 Oct',w:'Alice Uwase, PE',d:'2 days',x:'Family event. Cover: Mr. Habiyaremye takes her S2 PE classes.',st:[['Head',1],['Director',2]]},
