<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShuleTrip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1b3f;--navy2:#142a5c;--navy3:#1d3a7a;
  --blue:#2453d6;--blue-soft:#e9effd;
  --amber:#f5b400;--amber-soft:#fff5d6;--amber-ink:#8a5a00;
  --red:#d6372f;--red-soft:#fdeceb;
  --green:#12925a;--green-soft:#e3f5ec;
  --ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e4e8f1;--bg:#f3f5fa;--card:#fff;
  --radius:16px;--shadow:0 1px 2px rgba(15,23,42,.04),0 6px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
small{display:block;color:var(--muted);font-size:12px;font-weight:500}
b{font-weight:700}
a{color:var(--blue)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--navy);color:#c7d1ea;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px;color:#fff}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#ffd24d,#f59e0b);display:grid;place-items:center;color:var(--navy);flex:none;box-shadow:0 6px 16px rgba(245,180,0,.3)}
.brand b{font-size:18px;letter-spacing:-.02em;display:block}
.brand small{color:#8fa0c8;font-size:11px}
.navlbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6f80a8;padding:14px 12px 6px;font-weight:700}
.nav{all:unset;display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:11px;cursor:pointer;font-weight:600;color:#c7d1ea;box-sizing:border-box;width:100%}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:var(--navy2);color:#fff;box-shadow:inset 3px 0 0 var(--amber)}
.nav .cnt{margin-left:auto;background:var(--amber);color:var(--navy);font-size:11px;padding:1px 8px;border-radius:99px;font-weight:800}
.side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7f8fb6}
.side-foot button{all:unset;cursor:pointer;color:#c7d1ea;font-weight:600;display:inline-flex;gap:6px;align-items:center;margin-top:8px}
.side-foot button:hover{color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:66px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;gap:14px}
.top .crumb{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb small{display:inline;margin-left:6px}
.top-r{display:flex;align-items:center;gap:12px}
.pill-sel{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 12px}
.pill-sel span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pill-sel select{border:0;background:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-weight:600;color:var(--ink);max-width:240px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.iconbtn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);position:relative}
.iconbtn:hover{background:var(--bg)}
.iconbtn.sm{width:28px;height:28px;border-radius:8px;color:var(--muted)}
.iconbtn.sm:hover{background:var(--red-soft);color:var(--red)}
.iconbtn i{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.page{padding:26px 28px 70px;width:100%;max-width:1320px}
.demo-banner{background:var(--amber-soft);color:var(--amber-ink);border-bottom:1px solid #f3e2a6;font-size:12px;font-weight:600;padding:6px 28px;text-align:center}

h1{font-size:23px;margin:0 0 4px;letter-spacing:-.025em}
h2{font-size:16px;margin:0;letter-spacing:-.01em}
h3{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 22px;font-weight:500}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head .sub{margin:0}

/* ---------- primitives ---------- */
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.kpi{display:flex;gap:14px;align-items:flex-start}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .l{color:var(--muted);font-weight:600;font-size:12.5px}
.t-blue{background:var(--blue-soft);color:var(--blue)}.t-amber{background:var(--amber-soft);color:var(--amber-ink)}
.t-green{background:var(--green-soft);color:var(--green)}.t-red{background:var(--red-soft);color:var(--red)}
.t-navy{background:#e7eaf3;color:var(--navy)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.c-blue{background:var(--blue-soft);color:var(--blue)}.c-green{background:var(--green-soft);color:var(--green)}
.c-amber{background:var(--amber-soft);color:var(--amber-ink)}.c-red{background:var(--red-soft);color:var(--red)}
.c-gray{background:#eef1f6;color:var(--ink2)}.c-navy{background:var(--navy);color:#fff}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy3)}
.btn-a{background:var(--amber);color:var(--navy)}.btn-a:hover{filter:brightness(1.05)}
.btn-g{background:var(--green);color:#fff}.btn-r{background:#fff;color:var(--red);border-color:#f3c2bf}
.btn-o{background:#fff;color:var(--ink);border-color:var(--line)}.btn-o:hover{border-color:#c9d1e3}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-w{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}

table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover{background:#f8faff}
td small{margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:34px}
.tablewrap{overflow-x:auto;margin:0 -20px -20px;padding:0 8px}
.stage{display:inline-block;background:var(--blue-soft);color:var(--blue);padding:3px 9px;border-radius:8px;font-weight:700}

.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:7px 13px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;min-width:240px;color:var(--muted)}
.search input{border:0;outline:0;padding:10px 0;font:inherit;width:100%;color:var(--ink)}

/* ---------- hero ---------- */
.hero{background:radial-gradient(120% 140% at 100% 0%,#28509f 0%,var(--navy) 55%);color:#fff;border-radius:20px;padding:26px 28px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(245,180,0,.12)}
.hero h2{font-size:21px;letter-spacing:-.02em}
.hero p{color:#b9c6e6;margin:6px 0 0;max-width:560px}
.hero .meta{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.hero .meta div{font-size:12px;color:#8fa0c8;font-weight:600}
.hero .meta b{display:block;color:#fff;font-size:16px}
.hero .btn{position:relative;z-index:1}

/* ---------- lists ---------- */
.trip-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.trip-row:last-child{border-bottom:0}
.trip-row:hover h4{color:var(--blue)}
.trip-row h4{margin:0;font-size:14px}
.trip-row .dt{width:52px;height:56px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;border:1px solid var(--line)}
.trip-row .dt b{font-size:18px;line-height:1}.trip-row .dt small{font-size:10px;text-transform:uppercase;font-weight:700}
.trip-row .grow{flex:1;min-width:0}
.bar{height:8px;border-radius:9px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--navy)}
.barrow{display:grid;grid-template-columns:150px 1fr 32px;gap:10px;align-items:center;padding:7px 0;font-weight:600;font-size:13px}
.rule-mini{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.rule-mini:last-child{border:0}
.rule-mini .n{margin-left:auto;font-weight:800}

/* ---------- wizard ---------- */
.stepper{display:flex;gap:6px;margin-bottom:22px;overflow-x:auto;padding-bottom:4px}
.stepper button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:11px;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.stepper button span{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-size:11.5px;font-weight:800;color:var(--ink2)}
.stepper button.on{background:var(--navy);color:#fff}.stepper button.on span{background:var(--amber);color:var(--navy)}
.stepper button.done span{background:var(--green-soft);color:var(--green)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-weight:700;font-size:12.5px;color:var(--ink2)}
.fld input,.fld select,.fld textarea{font:inherit;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink);outline:0;width:100%;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(36,83,214,.1)}
.fld textarea{resize:vertical}
.chks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.chk{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff;transition:.15s}
.chk:hover{border-color:#c9d1e3}
.chk input,.rl input{position:absolute;opacity:0;pointer-events:none}
.box{width:20px;height:20px;border-radius:6px;border:2px solid #c3cbdc;display:grid;place-items:center;color:transparent;flex:none;margin-top:1px}
.chk input:checked+.box{background:var(--green);border-color:var(--green);color:#fff}
.chk:has(input:checked){border-color:#a8dcc2;background:#f6fcf9}
.chk b{font-size:13px;display:block}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.type{border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink2);transition:.15s}
.type input{position:absolute;opacity:0;pointer-events:none}
.type b{color:var(--ink);font-size:14px}
.type.on{border-color:var(--navy);background:#f5f7fd;box-shadow:inset 0 0 0 1px var(--navy)}
.type.on svg{color:var(--blue)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:500;margin-top:14px;align-items:flex-start}
.note svg{flex:none;margin-top:1px}
.n-blue{background:var(--blue-soft);color:#1b3c9e}.n-amber{background:var(--amber-soft);color:var(--amber-ink)}.n-red{background:var(--red-soft);color:#a3241e}.n-green{background:var(--green-soft);color:#0b6b41}
.wiz-foot{display:flex;justify-content:space-between;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);gap:10px;flex-wrap:wrap}

/* roster */
.lvl-sum{display:flex;gap:6px;flex-wrap:wrap}
.roster-wrap{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:12px;margin-top:14px}
.roster{min-width:860px}
.roster th{position:sticky;top:0;background:#f8faff;z-index:1;padding:9px 8px}
.roster td{padding:6px 8px;vertical-align:middle}
.roster td:first-child{color:var(--muted);font-weight:700;width:36px;text-align:center}
.roster input:not([type=checkbox]),.roster select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%;background:#fff;outline:0;color:var(--ink)}
.roster input:focus,.roster select:focus{border-color:var(--blue)}
.roster input.bad{border-color:var(--red);background:var(--red-soft)}
.roster input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.live{position:sticky;top:86px}
.ring{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring-n{font-size:12px;color:var(--muted);font-weight:600}
.ring-n b{font-size:20px;color:var(--ink);display:block;letter-spacing:-.02em}
.rules{max-height:calc(100vh - 290px);overflow:auto;margin:0 -6px;padding:0 6px}
.rule{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rule:last-child{border:0}
.ok{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.rule b{font-weight:600;display:block;font-size:12.5px}
.ok-y{background:var(--green-soft);color:var(--green)}.ok-n{background:var(--red-soft);color:var(--red)}.ok-w{background:var(--amber-soft);color:var(--amber-ink)}
.grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 0 2px}
.grp:first-child{margin-top:0}
.rgrp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.rgrp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 12px;user-select:none}
.rgrp>summary::-webkit-details-marker{display:none}
.rgrp>summary:hover{background:#f8faff;border-radius:12px}
.rgrp>summary b{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.rgrp>summary small{margin-right:auto}
.rgrp-body{padding:0 12px 4px;border-top:1px solid var(--line)}
.rgrp[open]{border-color:#c9d1e3}
details[open]>summary .caret{transform:rotate(-90deg)}

/* ---------- detail ---------- */
.tl{display:flex;gap:0;overflow-x:auto;padding:2px}
.tl-i{flex:1;min-width:150px;display:flex;gap:10px;align-items:flex-start;position:relative;padding-right:12px}
.tl-i:not(:last-child):after{content:"";position:absolute;left:34px;right:8px;top:14px;height:2px;background:var(--line)}
.tl-i.s-done:not(:last-child):after{background:var(--green)}
.tl-i .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--bg);color:var(--muted);border:2px solid var(--line);flex:none;position:relative;z-index:1}
.tl-i>div:last-child{padding-top:30px;margin-left:-38px;min-width:0}
.tl-i b{font-size:12.5px;display:block}
.s-done .dot{background:var(--green);border-color:var(--green);color:#fff}
.s-pending .dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 5px rgba(36,83,214,.15)}
.s-returned .dot{background:var(--amber);border-color:var(--amber);color:var(--navy)}
.s-rejected .dot{background:var(--red);border-color:var(--red);color:#fff}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.kv div{min-width:0}
.kv small{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:700;margin-bottom:2px}
.kv b{font-weight:600;word-wrap:break-word}
.sec{padding:18px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:800;font-size:13.5px}
.sec-h svg{color:var(--blue)}
.sec-h .chip{margin-left:auto}
details.dd>summary{list-style:none;cursor:pointer;margin-bottom:0;padding:4px 0;user-select:none}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary:hover{color:var(--blue)}
details.dd[open]>summary{margin-bottom:12px}
.caret{display:inline-flex;color:var(--muted);transition:transform .2s;transform:rotate(90deg)}
details.dd[open] .caret{transform:rotate(-90deg)}
.yes{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}
.act textarea,.bcast textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:11px;padding:10px 12px;resize:vertical;margin:10px 0 12px;outline:0}
.act textarea:focus,.bcast textarea:focus{border-color:var(--blue)}
.act .row{display:flex;gap:8px;flex-wrap:wrap}
.hist{position:relative;padding-left:18px}
.hist:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.hist div{position:relative;padding:0 0 12px}
.hist div:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy3)}
.scrollbox{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.scrollbox table{min-width:620px}
.scrollbox th{position:sticky;top:0;background:#f8faff;z-index:1}
.scrollbox td{padding:9px 12px;font-size:13px}
.scrollbox td a,.nowrap{white-space:nowrap}
.scrollbox tr:last-child td{border-bottom:0}
.routeline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:14px}
.routeline .sep{color:var(--muted);display:inline-flex}
.routeline small{width:100%;margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:700}

/* trip day */
.livepill{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--green)}
.livepill i{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,146,90,.5)}70%{box-shadow:0 0 0 9px rgba(18,146,90,0)}100%{box-shadow:0 0 0 0 rgba(18,146,90,0)}}
.qrstate{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.qrstate svg{flex:none;margin-top:1px}
.qs-valid{background:var(--green-soft);color:#0b6b41}.qs-upcoming{background:var(--blue-soft);color:#1b3c9e}
.qs-expired,.qs-closed,.qs-curfew,.qs-bad{background:var(--red-soft);color:#a3241e}
.roll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:430px;overflow:auto;padding:2px}
.rl{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 10px;cursor:pointer;background:#fff}
.rl.on{border-color:#a8dcc2;background:#f6fcf9}
.rl.on .box{background:var(--green);border-color:var(--green);color:#fff}
.rl b{font-size:13px;display:block}
.sms-prev{background:var(--navy);color:#e6ecfa;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:13px;margin-top:16px;max-width:540px}
.sms-prev small{color:#8fa0c8;margin-bottom:4px;font-weight:700}
.missing{background:var(--red-soft);border:1px solid #f5c8c4;border-radius:14px;padding:14px 16px;margin-bottom:16px;color:#a3241e}
.missing a{color:#a3241e;font-weight:800}

/* ---------- checkpoint ---------- */
.verify{display:flex;gap:10px;flex-wrap:wrap}
.verify input{flex:1;min-width:220px;font:inherit;font-size:16px;font-weight:700;letter-spacing:.02em;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;outline:0}
.verify input:focus{border-color:var(--navy)}
.codes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.codes button{all:unset;cursor:pointer;font-size:12px;font-weight:700;background:var(--bg);border:1px dashed #c3cbdc;padding:5px 10px;border-radius:8px}
.verdict{border-radius:16px;padding:20px 22px;display:flex;gap:16px;align-items:center;color:#fff}
.verdict.go{background:linear-gradient(135deg,#0f8a54,#12a865)}
.verdict.stop{background:linear-gradient(135deg,#b9271f,#e04a3f)}
.verdict.wait{background:linear-gradient(135deg,#1d3a7a,#2453d6)}
.verdict .big{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.verdict h2{font-size:19px;color:#fff}.verdict p{margin:3px 0 0;opacity:.92;font-weight:500}
.ck-row{display:grid;grid-template-columns:28px minmax(0,1fr) 170px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ck-row .num{font-weight:800;color:var(--muted)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:6px 8px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.y{background:var(--green);color:#fff}.seg button.n{background:var(--red);color:#fff}
.sys{font-size:11px;font-weight:700;margin-top:3px}
.scanbox{background:#000;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:1;max-width:420px;margin:0 auto}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox:after{content:"";position:absolute;inset:18%;border:3px solid var(--amber);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}

/* ---------- guide / settings ---------- */
.gcard h2{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.gcard ul{margin:0;padding-left:18px;color:var(--ink2)}
.gcard li{margin:6px 0}
.cap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.cap div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.cap b{font-size:24px;display:block;letter-spacing:-.03em}
.logo-slot{display:flex;gap:16px;align-items:center;border:1.5px dashed #c3cbdc;border-radius:14px;padding:14px;margin-bottom:12px}
.logo-slot .prev{width:72px;height:72px;display:grid;place-items:center;background:var(--bg);border-radius:12px;flex:none}
.logo-slot .prev img{width:64px;height:64px;object-fit:contain}
.logo-slot input[type=file]{font:inherit;font-size:12px;margin-top:8px;max-width:100%}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-l{background:radial-gradient(130% 120% at 0% 100%,#24489a 0%,var(--navy) 60%);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-l:before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(245,180,0,.10)}
.login-l h1{font-size:42px;line-height:1.08;letter-spacing:-.035em;max-width:520px;margin:0 0 16px}
.login-l h1 em{font-style:normal;color:var(--amber)}
.login-l p{color:#b9c6e6;font-size:15.5px;max-width:480px;margin:0}
.lstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px}
.lstats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px}
.lstats b{font-size:20px;display:block;color:#fff}
.lstats small{color:#9fb0d6}
.login-r{display:flex;align-items:center;justify-content:center;padding:40px 28px}
.login-card{width:100%;max-width:420px}
.role{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:16px;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;transition:.15s}
.role:hover{border-color:var(--navy);box-shadow:var(--shadow);transform:translateY(-1px)}
.role .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.role b{font-size:15px;display:block}
.role .arr{margin-left:auto;color:var(--muted)}

/* ---------- modal & cert ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,27,63,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
.modal{width:100%;max-width:820px}
.modal.narrow{max-width:520px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.cert{background:#fff;border-radius:18px;padding:30px 36px;position:relative;overflow:hidden;border:1px solid var(--line)}
.cert:before{content:"";position:absolute;inset:0;border-top:8px solid var(--navy);border-bottom:4px solid var(--amber);border-radius:18px;pointer-events:none}
.gov-head{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
.gov-org{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);line-height:1.35}
.crest-img{width:64px;height:64px;object-fit:contain}
.cert-title{text-align:center}
.cert-title h2{font-size:21px;letter-spacing:-.02em;margin:4px 0 8px}
.cert-title .org{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.cert .code{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:14px;background:var(--navy);color:#fff;padding:5px 12px;border-radius:8px;display:inline-block}
.cert .kv{margin-bottom:16px}
.cert-foot{display:flex;gap:24px;align-items:center;border-top:1px solid var(--line);padding-top:18px;margin-top:6px}
.cert-foot p{font-size:12px;color:var(--ink2);margin:0}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;text-align:center}
.qrbox b{font-size:12px}
.qrbox small{max-width:250px}
.stamp{width:100px;height:100px;border-radius:50%;border:3px solid var(--green);color:var(--green);display:grid;place-items:center;text-align:center;font-weight:800;font-size:11px;letter-spacing:.06em;transform:rotate(-12deg);flex:none;line-height:1.2}
.manifest table{font-size:12.5px}
.manifest td,.manifest th{padding:7px 8px}

/* ---------- public verify ---------- */
.pv{min-height:100vh;background:var(--bg)}
.pv-top{background:#fff;border-bottom:4px solid var(--amber);padding:16px 18px}
.pv-top .gov-head{margin:0 auto;padding:0;border:0;max-width:640px}
.pv-main{max-width:640px;margin:0 auto;padding:18px 16px 50px}
.bigverdict{border-radius:20px;padding:26px 22px;color:#fff;text-align:center;margin-bottom:16px}
.bigverdict .big{margin:0 auto 12px;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.bigverdict h1{color:#fff;font-size:25px}
.bigverdict p{margin:6px 0 0;opacity:.92;font-weight:500}
.bigverdict.go{background:linear-gradient(135deg,#0f8a54,#12a865)}
.bigverdict.stop{background:linear-gradient(135deg,#b9271f,#e04a3f)}
.bigverdict.wait{background:linear-gradient(135deg,#1d3a7a,#2453d6)}

#toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(11,27,63,.3);display:flex;gap:10px;align-items:center;animation:in .25s ease;max-width:380px}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

@media (max-width:1100px){
  .split{grid-template-columns:1fr}.live{position:static}.rules{max-height:none}
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;gap:4px}
  .brand{padding:0 10px 0 0}.brand small,.navlbl,.side-foot{display:none}
  .nav{width:auto;white-space:nowrap;padding:9px 11px}
  .nav.on{box-shadow:inset 0 -3px 0 var(--amber)}
  .top{padding:10px 16px;height:auto;min-height:60px;flex-wrap:wrap}
  .page{padding:18px 16px 60px}
  .k3,.k2,.fgrid,.fgrid.c3,.chks,.types,.kv{grid-template-columns:1fr}
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .login{grid-template-columns:1fr}.login-l{padding:32px 22px}.login-l h1{font-size:30px}
  .lstats{grid-template-columns:1fr 1fr 1fr;margin-top:24px}
  .ck-row{grid-template-columns:24px 1fr}.ck-row .seg{grid-column:2}
  .cert{padding:22px 18px}
  .gov-head{grid-template-columns:1fr 1fr}.gov-head .cert-title{grid-column:1/-1;order:3}
  .cert-foot{flex-direction:column;align-items:flex-start}
  .pill-sel select{max-width:170px}
  .search{min-width:0;width:100%}
}
@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;width:100%;border:0}
  .overlay{background:none;padding:0;position:static}
}

<script>
//---------------------------------------------------------------------
//

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';

function statusChip(t){

function kpi(icon,tone,v,l){return `<div class="card kpi"><div class="ico t-${tone}">${ic(icon,20)}</div><div><div class="v">${v}</div><div class="l">${l}</div></div></div>`}
function ringSvg(p,size=64){const r=size/2-6,c=2*Math.PI*r;const col=p>=1?'var(--green)':p>.75?'var(--amber)':'var(--red)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#edf0f6" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">${Math.round(p*100)}%</text></svg>`}
function ruleList(ev){
  const groups=[];ev.forEach(r=>{let g=groups.find(x=>x.name===r.group);if(!g){g={name:r.group,items:[]};groups.push(g)}g.items.push(r)});
  return groups.map(g=>{
    const fail=g.items.filter(r=>!r.ok&&r.sev==='block').length,warn=g.items.filter(r=>!r.ok&&r.sev==='warn').length,ok=g.items.filter(r=>r.ok).length;
    const chip=fail?`<span class="chip c-red">${fail} gap${fail>1?'s':''}</span>`:warn?`<span class="chip c-amber">${warn} to note</span>`:'<span class="chip c-green">All passed</span>';
    const key='rg-'+g.name;
    return `<details class="rgrp" data-dd="${key}" ${UI.dd[key]?'open':''}><summary><span class="ok ${fail?'ok-n':warn?'ok-w':'ok-y'}">${ic(fail?'x':warn?'alert':'check',12)}</span><b>${g.name}</b><small>${ok}/${g.items.length}</small>${chip}<span class="caret">${ic('arrow',14)}</span></summary><div class="rgrp-body">${g.items.map(r=>{
      const cls=r.ok?'ok-y':r.sev==='warn'?'ok-w':'ok-n';
      return `<div class="rule"><span class="ok ${cls}">${ic(r.ok?'check':r.sev==='warn'?'alert':'x',12)}</span><div><b>${r.rule}</b>${r.detail?`<small>${esc(r.detail)}</small>`:''}</div></div>`}).join('')}</div></details>`;
  }).join('');
}

function smsLog(t){
  const L=(t.live&&t.live.sms)||[];if(!L.length)return '';
  const cnt=k=>L.filter(m=>m.kind===k).length,failed=L.filter(m=>m.status!=='Delivered').length;
  return `<details class="sec dd" data-dd="sms" ${UI.dd.sms?'open':''}><summary class="sec-h">${ic('msg')}SMS to parents & guardians<span class="chip c-gray">${L.length} sent</span><span class="caret">${ic('arrow',15)}</span></summary>
  <div class="lvl-sum" style="margin-bottom:10px">${Object.keys(SMSK).filter(cnt).map(k=>`<span class="chip ${SMSK[k][1]}">${SMSK[k][0]}: ${cnt(k)}</span>`).join('')}${failed?`<span class="chip c-red">Failed: ${failed}</span>`:''}</div>
  <div class="scrollbox"><table><thead><tr><th>Time</th><th>Type</th><th>To</th><th>Message</th><th>Status</th></tr></thead><tbody>
  ${L.slice().reverse().map(m=>`<tr><td>${hhmm(m.at)}<small>${fmtDate(iso(m.at))}</small></td><td><span class="chip ${SMSK[m.kind][1]}">${SMSK[m.kind][0]}</span></td><td>${esc(m.guardian)}<small>${esc(m.phone)}</small></td><td style="min-width:300px;color:var(--ink2)">${esc(m.text)}</td><td>${m.status==='Delivered'?'<span class="yes">Delivered</span>':'<span class="no">Failed</span>'}</td></tr>`).join('')}
  </tbody></table></div></details>`;
}
function tripDayCard(t){
  if(t.status!=='approved'||!t.live)return '';
  const lv=t.live,isSchool=UI.role==='school',v=tripValidity(t),n=learnerTotal(t);
  const boarded=Object.values(lv.board).filter(Boolean).length;
  let body='';
  if(lv.status==='scheduled')body=`<p style="margin:0 0 14px;color:var(--ink2)">Departure ${fmtDate(t.departDate)} at ${t.departTime}. At boarding, the trip leader takes roll call and every guardian receives an SMS.</p>${isSchool?`<button class="btn btn-a btn-w" data-act="roll" data-arg="board">${ic('users')}Start trip · boarding roll call</button>`:'<span class="chip c-gray">Not started</span>'}`;
  else if(lv.status==='in_progress')body=`<div class="livepill"><i></i>Trip in progress</div><small style="margin:4px 0 14px">Started ${fmtDT(lv.startedAt)} · ${boarded} of ${n} on board</small>
    ${isSchool?`<div class="grid" style="gap:8px"><button class="btn btn-o btn-w" data-act="bcast">${ic('msg')}Message all guardians</button><button class="btn btn-p btn-w" data-act="roll" data-arg="drop">${ic('check')}End trip · drop-off roll call</button></div>`:''}
    ${UI.bcast&&isSchool?`<div class="bcast"><textarea id="bmsg" rows="3" placeholder="e.g. Bus delayed by heavy traffic at Kajjansi. Learners are safe; new arrival time 5:45 pm."></textarea><button class="btn btn-p btn-sm" data-act="sendbcast">Send to ${boarded} guardians</button></div>`:''}`;
  else body=`<b>Trip completed</b><small style="margin-top:4px">Started ${fmtDT(lv.startedAt)} · ended ${fmtDT(lv.endedAt)}</small><small>${boarded} boarded · ${Object.values(lv.drop).filter(Boolean).length} checked off${lv.missing.length?` · <span class="no">${lv.missing.length} not accounted for</span>`:''}</small>`;
  return `<div class="card"><h3>Trip day</h3>${body}<div class="qrstate qs-${v.k}">${ic('qr',16)}<span>QR clearance: <b>${v.title}</b><br><span style="font-weight:500">${v.msg}</span></span></div></div>`;
}
function rollPanel(t){
  const ro=roster(t),mode=UI.roll;
  const elig=mode==='drop'?ro.map((s,i)=>i).filter(i=>t.live.board[i]):ro.map((s,i)=>i);
  const present=elig.filter(i=>UI.marks[i]).length;
  const sample=ro[elig[0]]||{name:'Learner'};
  return `<div class="card" style="margin-bottom:16px;border-color:var(--navy)"><div class="card-h"><h2>${mode==='board'?'Boarding roll call':'Drop-off roll call'}</h2><span class="chip c-navy" id="rollcount">${present} / ${elig.length} present</span></div>
  <p class="sub" style="margin-bottom:14px">${mode==='board'?'Tick each learner as they board. On confirm, guardians of learners on board get a departure SMS; guardians of absent learners are told their child did not board.':'Tick each learner as they are checked off at school or handed to a guardian. Their guardian gets a “returned safely” SMS. Anyone not ticked is flagged to the trip leader and the DEO.'}</p>
  <div class="row-btns" style="margin:0 0 12px"><button class="btn btn-o btn-sm" data-act="markall" data-arg="1">Mark all present</button><button class="btn btn-o btn-sm" data-act="markall" data-arg="0">Clear all</button></div>
  <div class="roll-grid">${elig.map(i=>{const s=ro[i];return `<label class="rl ${UI.marks[i]?'on':''}"><input type="checkbox" data-mark="${i}" ${UI.marks[i]?'checked':''}><span class="box">${ic('check',12)}</span><span><b>${esc(s.name)}</b><small>${s.cls} · ${esc(s.guardian)}</small></span></label>`}).join('')}</div>
  <div class="sms-prev"><small>SMS preview · sender ${esc(S.settings.sender||'SHULETRIP')}</small>${esc(smsText(t,mode==='board'?'dep':'ret',sample))}</div>
  <div class="wiz-foot"><button class="btn btn-o" data-act="rollcancel">Cancel</button><button class="btn btn-p" data-act="rollconfirm" id="rollbtn">${ic('check')}Confirm & notify guardians</button></div></div>`;
}

  <div class="card" style="margin-bottom:16px">${timeline(t)}</div>
  ${lastNote?`<div class="note ${lastNote.status==='rejected'?'n-red':'n-amber'}" style="margin:0 0 16px">${ic('alert')}<span><b>${lastNote.name}:</b> ${esc(lastNote.note)}</span></div>`:''}
  ${miss.length?`<div class="missing"><b>${ic('alert',16)} ${miss.length} learner${miss.length>1?'s were':' was'} not checked off at drop-off.</b> The DEO has been alerted. Call the guardian now:<br>${miss.map(i=>{const s=roster(t)[i];return `${esc(s.name)} (${s.cls}) — ${esc(s.guardian)} <a href="${telOf(s.phone)}">${esc(s.phone)}</a>`}).join('<br>')}</div>`:''}
  ${UI.roll&&UI.role==='school'?rollPanel(t):''}
  <div class="grid split">
    <div class="card">
      <div class="sec"><div class="sec-h">${ic('map')}Trip</div><div class="kv">
        <div><small>Destination</small><b>${esc(t.destination)}</b></div><div><small>Departure</small><b>${fmtDate(t.departDate)} · ${t.departTime}</b></div><div><small>Return</small><b>${fmtDate(t.returnDate)} · ${t.returnTime}</b></div>
        <div><small>Requested</small><b>${fmtDate(t.submittedAt)}</b></div><div><small>Notice</small><b>${daysBetween(t.submittedAt,t.departDate)} days</b></div><div><small>Approval route</small><b>${t.stages.map(s=>s.k).join(' → ')}</b></div></div>
        ${routeLine(R.from,R.via,t.destination)}
        ${t.purpose?`<p style="margin:14px 0 0;color:var(--ink2)"><b>Purpose.</b> ${esc(t.purpose)}</p>`:''}${t.itinerary?`<p style="margin:8px 0 0;color:var(--ink2)"><b>Itinerary.</b> ${esc(t.itinerary)}</p>`:''}</div>
      <details class="sec dd" data-dd="learners" ${UI.dd.learners?'open':''}><summary class="sec-h">${ic('users')}Learners & guardians<span class="chip c-navy">${learnerTotal(t)} learners</span><span class="caret">${ic('arrow',15)}</span></summary>
        <div class="lvl-sum" style="margin-bottom:10px">${LEVELS.filter(([k])=>LC[k]>0).map(([k,l,,c])=>`<span class="chip ${c==='ban'?'c-red':c==='exc'?'c-amber':'c-gray'}">${l}: ${LC[k]}</span>`).join('')}<span class="chip c-gray">Signed list: ${t.learners.listSigned?'Yes':'No'}</span></div>
        ${t.learners.p13Just?`<p style="margin:0 0 10px;color:var(--ink2)"><b>P1–P3 justification.</b> ${esc(t.learners.p13Just)}</p>`:''}
        ${manifestTable(t,true)}</details>
      ${smsLog(t)}
      <div class="sec"><div class="sec-h">${ic('bus')}Vehicle</div><div class="kv">
        <div><small>Plate</small><b>${esc(V.plate)}</b></div><div><small>Type</small><b>${VEHICLES[V.kind].label} (${VEHICLES[V.kind].seats} seats)</b></div><div><small>Ownership</small><b>${V.owner==='hired'?'Hired PSV':'School vehicle'}</b></div>
        <div><small>Year</small><b>${V.year||'—'}</b></div><div><small>${V.owner==='hired'?'PSV licence':'PMO licence'}</small><b>${esc(V.owner==='hired'?V.psv:V.pmo)||'—'}</b></div><div><small>Docs valid until</small><b>${fmtDate(V.expiry)}</b></div>
        <div><small>Roadworthy</small><b>${yn(V.roadworthy)}</b></div><div><small>Third party / comprehensive</small><b>${yn(V.insThird)} / ${yn(V.insComp)}</b></div><div><small>Cover per learner</small><b>UGX ${V.cover||0}M</b></div>
        <div><small>70 km/h governor</small><b>${yn(V.governor)}</b></div><div><small>School label</small><b>${yn(V.labelled)}</b></div>${V.owner==='hired'?`<div><small>MoWT letter</small><b>${yn(V.mowtLetter)}</b></div>`:''}</div></div>
      <div class="sec"><div class="sec-h">${ic('steer')}Driver</div><div class="kv">
        <div><small>Name</small><b>${esc(Dr.name)}</b></div><div><small>Phone</small><b>${esc(Dr.phone)||'—'}</b></div><div><small>Permit class</small><b>${Dr.permit||'—'}</b></div>
        <div><small>Experience</small><b>${Dr.years} years</b></div><div><small>PSV badge</small><b>${yn(Dr.badge)}</b></div><div><small>Defensive driving</small><b>${yn(Dr.defensive)}</b></div><div><small>Clean 3-yr record</small><b>${yn(Dr.clean)}</b></div></div></div>
      <div class="sec"><div class="sec-h">${ic('shield')}Supervision & route checks</div><div class="kv">
        <div><small>Trip leader</small><b>${esc(Sf.lead)||'—'}</b><small>${Sf.leadPhone?`<a href="${telOf(Sf.leadPhone)}">${esc(Sf.leadPhone)}</a>`:''}</small></div><div><small>Teachers (M / F)</small><b>${Sf.male} / ${Sf.female}</b></div><div><small>Parents</small><b>${Sf.parents||0}</b></div>
        <div><small>Designated staff</small><b>${esc(Sf.assistant)||'—'}</b></div><div><small>Letter of assignment</small><b>${yn(Sf.letter)}</b></div><div><small>Route pre-drive</small><b>${fmtDate(R.predrive)}</b></div>
        <div><small>Chart · logbook · roll call</small><b>${yn(R.chart&&R.logbook&&R.rollcall)}</b></div><div><small>Governing body approval</small><b>${yn(R.sgb)}</b></div><div><small>Transport policy</small><b>${yn(R.policy)}</b></div></div></div>
      ${t.inspections.length?`<div class="sec"><div class="sec-h">${ic('scan')}Checkpoint inspections</div>${t.inspections.map(x=>`<div class="rule-mini"><span class="chip ${x.rec==='yes'?'c-green':'c-red'}">${x.rec==='yes'?'Recommended':'Stopped'}</span><div><b>${esc(x.post)}</b><small>${esc(x.officer)} · ${fmtDT(x.at)}${x.notSeen?` · ${x.notSeen} items not seen`:''}</small></div></div>`).join('')}</div>`:''}
    </div>
    <div class="grid" style="gap:16px">
      ${tripDayCard(t)}
      ${canAct?`<div class="card act"><h3>Decision · ${c.name}</h3>${bl.length?`<div class="note n-red" style="margin:0">${ic('alert')}<span>${bl.length} mandatory requirement${bl.length>1?'s are':' is'} not met.</span></div>`:`<div class="note n-green" style="margin:0">${ic('check')}<span>All mandatory requirements met.</span></div>`}
        <textarea id="dnote" rows="3" placeholder="Note to the school (required when returning or rejecting)"></textarea>
        <div class="row"><button class="btn btn-g" data-act="decide" data-arg="approve">${ic('check')}${t.stages.indexOf(c)===t.stages.length-1?'Approve & issue clearance':'Approve'}</button><button class="btn btn-o" data-act="decide" data-arg="return">Return</button><button class="btn btn-r" data-act="decide" data-arg="reject">Reject</button></div></div>`:''}
      ${UI.role==='gov'&&t.status==='in_review'&&c&&!canAct?`<div class="note n-blue" style="margin:0">${ic('clock')}<span>Awaiting <b>${c.name}</b>. Switch office in the top bar to act on this stage.</span></div>`:''}
      <div class="card"><h3>Compliance check</h3><div class="ring">${ringSvg(ev.filter(r=>r.ok).length/ev.length,58)}<div class="ring-n"><b>${bl.length?bl.length+' blockers':'Compliant'}</b>${ev.filter(r=>r.ok).length} of ${ev.length} checks passing</div></div>${ruleList(ev)}</div>
      <div class="card"><h3>Activity</h3><div class="hist">${t.history.slice().reverse().map(h=>`<div><b style="font-size:12.5px">${esc(h.who)}</b><small>${fmtDate(h.at)} — ${esc(h.text)}</small></div>`).join('')}</div></div>
    </div></div>`;
}

/* ---------- government views ---------- */
function overview(){
  const all=S.trips,inrev=all.filter(t=>t.status==='in_review'),appr=all.filter(t=>t.status==='approved'),bad=all.filter(t=>t.status==='returned'||t.status==='rejected');
  const pipe=['deo','cao','ps','mowt'].map(r=>[GOV[r],inrev.filter(t=>cur(t)&&cur(t).role===r).length]);
  const dist={};all.forEach(t=>{const d=schoolOf(t.schoolId).district;dist[d]=(dist[d]||0)+1});
  const dmax=Math.max(1,...Object.values(dist));
  const gaps={};all.filter(t=>t.status!=='approved').forEach(t=>blockers(t).forEach(r=>{gaps[r.rule]=(gaps[r.rule]||0)+1}));
  const up=appr.filter(t=>t.live&&t.live.status!=='completed'&&t.returnDate>=TODAY).sort((a,b)=>a.departDate<b.departDate?-1:1);
  const sms=all.reduce((s,t)=>s+((t.live&&t.live.sms.length)||0),0);
  const onroad=appr.filter(t=>t.live&&t.live.status==='in_progress');
  const mq=myQueue();
  return `<div class="head"><div><h1>${UI.gov==='admin'?'National overview':GOV[UI.gov]}</h1><p class="sub">School trip and transport clearances · ${fmtDate(TODAY)}</p></div><button class="btn btn-p" data-act="nav" data-arg="queue">${ic('list')}Open review queue${mq.length?` (${mq.length})`:''}</button></div>
  <div class="grid k4">${kpi('clock','blue',mq.length,UI.gov==='admin'?'Awaiting review (all offices)':'Awaiting your office')}${kpi('shield','green',appr.length,'Clearances issued')}${kpi('bus','navy',onroad.length,'Trips on the road now')}${kpi('msg','amber',sms,'Guardian SMS sent')}</div>
  <div class="grid k3" style="margin-top:16px">
    <div class="card"><h2 style="margin-bottom:12px">Approval pipeline</h2>${pipe.map(([n,v])=>`<div class="barrow"><span>${n}</span><div class="bar"><i style="width:${Math.min(100,v*25)}%;background:var(--blue)"></i></div><b>${v}</b></div>`).join('')}<small style="margin-top:10px">${bad.length} returned or rejected</small></div>
    <div class="card"><h2 style="margin-bottom:12px">Requests by district</h2>${Object.entries(dist).sort((a,b)=>b[1]-a[1]).map(([d,v])=>`<div class="barrow"><span>${d}</span><div class="bar"><i style="width:${v/dmax*100}%"></i></div><b>${v}</b></div>`).join('')}</div>
    <div class="card"><h2 style="margin-bottom:12px">Most common compliance gaps</h2>${Object.entries(gaps).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([r,v])=>`<div class="rule-mini"><span class="ok ok-n">${ic('x',12)}</span><small style="color:var(--ink2);font-weight:600">${r}</small><span class="n">${v}</span></div>`).join('')||'<p class="sub">No open gaps.</p>'}</div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h2>Cleared trips — upcoming & on the road</h2><span class="chip c-green">${up.reduce((s,t)=>s+learnerTotal(t),0)} learners</span></div>${up.map(tripRow).join('')||'<p class="empty">None scheduled.</p>'}</div>`;
}
function queueList(){
  let l=S.trips.slice();const f=UI.filter;
  if(f==='mine')l=myQueue();else if(f!=='all')l=l.filter(t=>t.status===f);
  const q=UI.q.toLowerCase().trim();
  if(q)l=l.filter(t=>{const s=schoolOf(t.schoolId);return (t.ref+' '+t.title+' '+s.name+' '+s.district+' '+t.destination+' '+t.vehicle.plate).toLowerCase().includes(q)});
  return l.sort((a,b)=>a.departDate<b.departDate?-1:1);
}
function queueRows(){
  return queueList().map(t=>{const s=schoolOf(t.schoolId),b=blockers(t).length,d=daysBetween(TODAY,t.departDate),c=cur(t);
    return `<tr data-act="open" data-arg="${t.id}"><td><b>${t.ref}</b><small>${esc(t.title)}</small></td><td>${esc(s.name)}<small>${s.district}</small></td><td>${typeChip(t.type)}</td><td>${fmtDate(t.departDate)}<small>${d>0?`in ${d} days`:d===0?'today':`${-d} days ago`}</small></td><td>${learnerTotal(t)}</td><td>${b?`<span class="chip c-red">${b} gaps</span>`:'<span class="chip c-green">Compliant</span>'}</td><td>${t.status==='in_review'&&c?`<span class="stage">${c.k}</span><small>${c.name}</small>`:statusChip(t)}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nothing here.</td></tr>';
}
function queue(){
  const tabs=[['mine',UI.gov==='admin'?'Awaiting review':'My queue'],['all','All'],['approved','Cleared'],['returned','Returned'],['rejected','Rejected']];
  return `<div class="head"><div><h1>${UI.gov==='police'?'Cleared trips':'Review queue'}</h1><p class="sub">${UI.gov==='police'?'Trips cleared to travel — verify at checkpoints':'Open a request to review documents, the learner manifest and compliance, then decide'}</p></div></div>
  <div class="card"><div class="card-h" style="flex-wrap:wrap"><div class="tabs">${tabs.map(([k,l])=>`<button class="${UI.filter===k?'on':''}" data-act="filter" data-arg="${k}">${l}</button>`).join('')}</div>
  <label class="search">${ic('search',16)}<input id="q" placeholder="Search school, district, plate, ref…" value="${esc(UI.q)}"></label></div>
  <div class="tablewrap"><table><thead><tr><th>Request</th><th>School</th><th>Type</th><th>Departure</th><th>Learners</th><th>Compliance</th><th>Stage / status</th></tr></thead><tbody id="qbody">${queueRows()}</tbody></table></div></div>`;
}
function findClear(q){q=String(q).toUpperCase().replace(/\s+/g,'');if(!q)return null;return S.trips.find(t=>t.status==='approved'&&(t.clearance.code.replace(/\s+/g,'')===q||t.vehicle.plate.toUpperCase().replace(/\s+/g,'')===q))}
function autoRec(t,kw){if(kw===null)return null;if(kw==='Authorisation')return t.status==='approved';if(kw==='PSV'&&t.vehicle.owner!=='hired')return 'na';if(kw==='PMO'&&t.vehicle.owner==='hired')return 'na';const r=evaluate(t).find(x=>x.rule.includes(kw));return r?r.ok:null}
function verdictBox(v,sigBad,cls='verdict'){
  if(sigBad)return `<div class="${cls} stop"><div class="big">${ic('x',30)}</div><div><h${cls==='verdict'?2:1}>Invalid QR code</h${cls==='verdict'?2:1}><p>The code has been altered or was not issued by ShuleTrip. Do not allow the vehicle to proceed with learners.</p></div></div>`;
  const tone=v.ok?'go':v.k==='upcoming'?'wait':'stop';
  return `<div class="${cls} ${tone}"><div class="big">${ic(v.ok?'check':v.k==='upcoming'?'clock':'alert',30)}</div><div><h${cls==='verdict'?2:1}>${v.title}</h${cls==='verdict'?2:1}><p>${v.msg}</p></div></div>`;
}
function checkpoint(){
  const codes=S.trips.filter(t=>t.status==='approved');
  const tok=parseToken(UI.verify);
  let t=null,p=null;
  if(tok){p=tok.p;t=S.trips.find(x=>x.clearance&&x.clearance.code===p.c)||null}
  else if(UI.verify){t=findClear(UI.verify);if(t)p=payloadOf(t)}
  let res='';
  if(UI.verify&&!p)res=`<div class="verdict stop" style="margin-top:16px"><div class="big">${ic('x',28)}</div><div><h2>No valid clearance found</h2><p>"${esc(UI.verify.slice(0,60))}" does not match a cleared trip. The vehicle should not proceed with learners.</p></div></div>`;
  if(p){
    const v=validity(p,now(),t&&t.live&&t.live.status==='completed',t&&t.live&&t.live.endedAt);
    res=`<div style="margin-top:16px">${verdictBox(v,tok&&!tok.sigOk)}</div>`;
    if(!(tok&&!tok.sigOk)){
      res+=`<div class="card" style="margin-top:16px"><div class="card-h"><h2>${esc(p.s)}</h2><span class="chip c-navy">${esc(p.c)}</span></div>

const SCAN={stream:null};
function stopScan(){if(SCAN.stream){SCAN.stream.getTracks().forEach(x=>x.stop());SCAN.stream=null}}
async function startScan(){
  try{const v=document.getElementById('scanv');const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});SCAN.stream=st;v.srcObject=st;await v.play();
    const det=new BarcodeDetector({formats:['qr_code']});
    const loop=async()=>{if(!SCAN.stream)return;try{const r=await det.detect(v);if(r.length){stopScan();UI.modal=null;UI.verify=r[0].rawValue;UI.insp={seen:{}};render();return}}catch(e){}requestAnimationFrame(loop)};loop();
  }catch(e){stopScan();UI.modal=null;render();toast('Camera not available — enter the code or plate instead','err')}

function pageView(){
  switch(UI.view){
    case 'dash':return schoolDash();case 'trips':return schoolTrips();case 'new':return wizard();

function render(){
  const app=document.getElementById('app');

function go(v){UI.view=v;UI.roll=null;UI.bcast=false;window.scrollTo(0,0);render()}

/* ---------- actions ---------- */
const ACT={
  login:r=>{UI.role=r;UI.view=r==='school'?'dash':'overview';UI.filter='mine';render()},
  logout:()=>{UI.role=null;UI.modal=null;render()},
  reset:()=>{if(confirm('Reset all demo data?')){S=seed();save();UI.tripId=null;go(UI.role==='school'?'dash':(UI.gov==='police'?'checkpoint':'overview'));toast('Demo data reset','ok')}},
  nav:v=>{if(v==='new')return ACT.new();if(v==='queue'&&UI.gov==='police')UI.filter='approved';go(v)},
  open:id=>{UI.tripId=id;UI.modal=null;go('detail')},
  new:()=>{UI.draft=blankDraft();UI.editing=null;UI.step=0;UI.paste=false;go('new')},
  edit:id=>{const t=S.trips.find(x=>x.id===id);UI.draft=clone({schoolId:t.schoolId,type:t.type,title:t.title,destination:t.destination,purpose:t.purpose,itinerary:t.itinerary,departDate:t.departDate,departTime:t.departTime,returnDate:t.returnDate,returnTime:t.returnTime,learners:t.learners,vehicle:t.vehicle,driver:t.driver,staff:t.staff,route:t.route,declare:false});UI.editing=id;UI.step=0;go('new')},
  step:i=>{collect();UI.step=+i;go('new')},
  next:()=>{collect();UI.step=Math.min(STEPS.length-1,UI.step+1);go('new')},
  prev:()=>{collect();UI.step=Math.max(0,UI.step-1);go('new')},
  addrow:()=>{collect();D().learners.roster.push({name:'',cls:'P6',gender:'F',guardian:'',phone:'',consent:false});render()},
  rmrow:j=>{collect();D().learners.roster.splice(+j,1);render()},
  togglepaste:()=>{collect();UI.paste=!UI.paste;render()},
  allconsent:()=>{collect();D().learners.roster.forEach(s=>s.consent=true);render()},
  sample:()=>{collect();D().learners.roster.push(...genRoster('sample'+Date.now(),{p47:24},24,SINGLE[D().schoolId]));render()},
  importpaste:()=>{
    collect();const txt=(document.getElementById('pastebox')||{}).value||'';let n=0;
    txt.split(/\r?\n/).forEach(line=>{const c=line.split(/\t|,|;/).map(x=>x.trim());if(!c[0])return;
      D().learners.roster.push({name:c[0],cls:normClass(c[1]),gender:/^f/i.test(c[2]||'')?'F':'M',guardian:c[3]||'',phone:c[4]||'',consent:false});n++});
    UI.paste=false;render();toast(`${n} learner${n===1?'':'s'} added — tick consent as forms come in`,'ok')},
  submit:()=>{
    collect();const d=D();const bl=evaluate(merge(clone(d),{submittedAt:TODAY})).filter(r=>!r.ok&&r.sev==='block');
    if(!d.title||!d.destination){toast('Add a trip title and destination','err');UI.step=0;return go('new')}
    if(bl.length){toast(`${bl.length} blocker${bl.length>1?'s':''} still open — see the compliance panel`,'err');return}
    if(!d.declare){toast('Tick the declaration to submit','err');return}
    if(UI.editing){
      const t=S.trips.find(x=>x.id===UI.editing);
      ['title','destination','purpose','itinerary','departDate','departTime','returnDate','returnTime','learners','vehicle','driver','staff','route'].forEach(k=>t[k]=clone(d[k]));
      t.submittedAt=TODAY;const s=t.stages.find(x=>x.status==='returned');if(s){s.status='pending';delete s.note}
      t.status='in_review';t.history.push({at:TODAY,who:schoolOf(t.schoolId).name,text:'Corrections made and request resubmitted'});
      save();toast('Request resubmitted','ok');UI.editing=null;return ACT.open(t.id);
    }
    const n=Math.max(...S.trips.map(t=>+t.ref.split('-')[2]))+1;
    const t=mkTrip({ref:`ST-${new Date().getFullYear()}-${String(n).padStart(4,'0')}`,schoolId:d.schoolId,type:d.type});
    ['title','destination','purpose','itinerary','departDate','departTime','returnDate','returnTime'].forEach(k=>t[k]=d[k]);
    ['learners','vehicle','driver','staff','route'].forEach(k=>t[k]=clone(d[k]));
    t.submittedAt=TODAY;t.history=[];setStage(t,1);
    t.history.push({at:TODAY,who:schoolOf(t.schoolId).name,text:'Request submitted to '+t.stages[1].name});
    S.trips.push(t);save();toast(`${t.ref} submitted to ${t.stages[1].name}`,'ok');ACT.open(t.id);
  },
  decide:kind=>{
    const t=trip(),c=cur(t),note=((document.getElementById('dnote')||{}).value||'').trim();
    if(kind!=='approve'&&!note){toast('Add a note telling the school what to correct','err');return}
    const bl=blockers(t);
    if(kind==='approve'&&bl.length&&!confirm(`${bl.length} mandatory requirement(s) are not met. Approve anyway?`))return;
    c.by=OFFICERS[c.role]+(UI.gov==='admin'&&c.role!=='school'?' (via MoES admin)':'');c.at=TODAY;
    if(kind==='approve'){c.status='done';if(note)c.note=note;
      t.history.push({at:TODAY,who:c.by,text:`${c.name} — approved${note?': '+note:''}`});
      const i=t.stages.indexOf(c);if(i<t.stages.length-1){t.stages[i+1].status='pending';toast(`Approved — forwarded to ${t.stages[i+1].name}`,'ok')}else{issue(t);toast('Clearance '+t.clearance.code+' issued','ok')}}
    else if(kind==='return'){c.status='returned';c.note=note;t.status='returned';t.history.push({at:TODAY,who:c.by,text:'Returned for corrections — '+note});toast('Returned to school')}
    else{c.status='rejected';c.note=note;t.status='rejected';t.history.push({at:TODAY,who:c.by,text:'Rejected — '+note});toast('Request rejected','err')}
    save();render();
  },
  /* trip day */
  roll:mode=>{const t=trip();
    if(mode==='board'){const d=iso(now());if((d<t.departDate||d>t.returnDate)&&!confirm(`This trip is scheduled for ${fmtDate(t.departDate)}. Simulate the trip day for the demo?`))return}
    UI.roll=mode;UI.bcast=false;UI.marks={};roster(t).forEach((s,i)=>{UI.marks[i]=mode==='board'?true:!!t.live.board[i]});render();window.scrollTo(0,0)},
  rollcancel:()=>{UI.roll=null;render()},
  markall:v=>{const t=trip();roster(t).forEach((s,i)=>{if(UI.roll==='board'||t.live.board[i])UI.marks[i]=v==='1'});render()},
  rollconfirm:()=>{
    const t=trip(),ro=roster(t),at=now(),lv=t.live;
    if(UI.roll==='board'){
      lv.board={};let on=0;ro.forEach((s,i)=>{const p=!!UI.marks[i];lv.board[i]=p;if(p)on++;sendSms(t,p?'dep':'absent',s,at)});
      lv.status='in_progress';lv.startedAt=at.toISOString();
      t.history.push({at:iso(at),who:t.staff.lead||'Trip leader',text:`Trip started — ${on} of ${ro.length} learners boarded at ${hhmm(at)}; ${ro.length} guardians notified by SMS`});
      toast(`Trip started · ${ro.length} SMS sent to guardians`,'ok');
    }else{
      const missing=[];lv.drop={};ro.forEach((s,i)=>{if(!lv.board[i])return;const p=!!UI.marks[i];lv.drop[i]=p;if(p)sendSms(t,'ret',s,at);else missing.push(i)});
      if(missing.length&&!confirm(`${missing.length} learner(s) have not been checked off. Close the trip and alert the DEO?`))return;
      lv.missing=missing;lv.status='completed';lv.endedAt=at.toISOString();
      t.history.push({at:iso(at),who:t.staff.lead||'Trip leader',text:`Trip completed at ${hhmm(at)} — ${Object.values(lv.drop).filter(Boolean).length} learners checked off, guardians notified. Clearance closed.`});
      if(missing.length)t.history.push({at:iso(at),who:'ShuleTrip',text:`ALERT to ${OFFICERS.deo}: ${missing.length} learner(s) not checked off at drop-off`});
      toast(missing.length?`${missing.length} learner(s) not accounted for — DEO alerted`:'Trip completed · guardians notified · QR closed',missing.length?'err':'ok');
    }
    UI.roll=null;save();render();
  },
  bcast:()=>{UI.bcast=!UI.bcast;render()},
  sendbcast:()=>{const t=trip(),msg=((document.getElementById('bmsg')||{}).value||'').trim();if(!msg){toast('Type a message first','err');return}
    const at=now();let n=0;roster(t).forEach((s,i)=>{if(t.live.board[i]){sendSms(t,'msg',s,at,msg);n++}});
    t.history.push({at:iso(at),who:t.staff.lead||'Trip leader',text:`Update sent to ${n} guardians: ${msg}`});UI.bcast=false;save();render();toast(`Update sent to ${n} guardians`,'ok')},
  /* modals */
  cert:id=>{UI.modal={type:'cert',id};render()},
  manifest:id=>{UI.modal={type:'manifest',id};render()},
  preview:id=>{const t=S.trips.find(x=>x.id===id);UI.modal=null;location.hash='v='+token(t);render();window.scrollTo(0,0)},
  exitverify:()=>{history.replaceState(null,'',location.pathname+location.search);render()},
  close:()=>{stopScan();UI.modal=null;render()},
  closebg:(a,el,e)=>{if(e.target===el){UI.modal=null;render()}},
  print:()=>window.print(),
  filter:f=>{UI.filter=f;render()},
  /* checkpoint */
  verify:()=>{UI.verify=document.getElementById('vcode').value.trim();UI.insp={seen:{}};render()},
  pick:c=>{UI.verify=c;UI.insp={seen:{}};render()},
  scan:()=>{if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('This browser cannot scan here — use the phone camera on the QR, or type the code','err');return}UI.modal={type:'scan'};render();startScan()},
  seen:a=>{const [i,v]=a.split(':');UI.insp.seen[i]=UI.insp.seen[i]===v?undefined:v;
    const keep=['i-off','i-post','i-rec'].map(id=>document.getElementById(id).value);render();
    ['i-off','i-post','i-rec'].forEach((id,k)=>document.getElementById(id).value=keep[k])},
  inspect:id=>{
    const t=S.trips.find(x=>x.id===id),off=document.getElementById('i-off').value.trim(),post=document.getElementById('i-post').value.trim(),rec=document.getElementById('i-rec').value;
    if(!off||!post||!rec){toast('Officer name & rank, check point and recommendation are required','err');return}
    const notSeen=Object.values(UI.insp.seen).filter(v=>v==='n').length;
    t.inspections.push({at:new Date().toISOString(),officer:off,post,rec,notSeen});
    t.history.push({at:TODAY,who:off,text:`Checkpoint inspection at ${post} — ${rec==='yes'?'recommended to travel':'NOT recommended to travel'}`});
    save();UI.insp={seen:{}};toast(rec==='yes'?'Inspection logged — recommended to travel':'Inspection logged — vehicle stopped',rec==='yes'?'ok':'err');render();
  },
  /* admin */
  access:id=>{const s=S.schools.find(x=>x.id===id);s.access=!s.access;save();toast(`${s.name}: access ${s.access?'restored':'suspended'}`);render()},
  addschool:()=>{
    const name=document.getElementById('ns-name').value.trim(),dist=document.getElementById('ns-dist').value.trim();
    if(!name||!dist){toast('Enter the school name and district','err');return}
    const id='SCH'+(S.schools.length+1)+hash(name).toString(36).slice(0,3);
    S.schools.push({id,name,district:dist,head:document.getElementById('ns-head').value.trim(),level:document.getElementById('ns-level').value,mixed:document.getElementById('ns-mixed').value==='1',emis:'UG-'+dist.slice(0,3).toUpperCase()+'-'+String(hash(id)%9000+1000),access:true});
    save();toast(`Access issued to ${name}`,'ok');render();
  },
  savesettings:()=>{S.settings.verifyBase=document.getElementById('st-base').value.trim();S.settings.sender=document.getElementById('st-sender').value.trim()||'SHULETRIP';save();toast('Settings saved','ok');render()},
  clearlogo:k=>{S.settings[k]='';save();render()},
  setclock:()=>{const v=document.getElementById('st-now').value;if(!v){toast('Pick a date and time','err');return}S.settings.demoNow=v;save();toast('Demo clock set','ok');render()},
  clearclock:()=>{S.settings.demoNow='';save();toast('Using real time','ok');render()}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.tagName==='A')e.preventDefault();
  if(a.closest('.chk')||a.closest('.type'))return;
  const fn=ACT[a.dataset.act];if(fn)fn(a.dataset.arg,a,e);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){UI.q=el.value;document.getElementById('qbody').innerHTML=queueRows();return}
  if(el.closest('#wiz')){collect();if(el.dataset.k&&/\.phone$/.test(el.dataset.k))el.classList.toggle('bad',!!el.value&&!okPhone(el.value));
    const l=document.getElementById('live');if(l)l.innerHTML=livePanel(D())}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('[data-gov]')){UI.gov=el.value;UI.filter=UI.gov==='police'?'approved':'mine';UI.verify='';go(UI.gov==='police'?'checkpoint':'overview');return}
  if(el.matches('[data-school]')){UI.school=el.value;go('dash');return}
  if(el.matches('[data-mark]')){const i=el.dataset.mark;UI.marks[i]=el.checked;el.closest('.rl').classList.toggle('on',el.checked);
    const t=trip();const elig=UI.roll==='drop'?roster(t).map((s,j)=>j).filter(j=>t.live.board[j]):roster(t).map((s,j)=>j);
    document.getElementById('rollcount').textContent=`${elig.filter(j=>UI.marks[j]).length} / ${elig.length} present`;return}
  if(el.matches('[data-logo]')){const f=el.files&&el.files[0];if(!f)return;if(f.size>400000){toast('Image too large — use one under 300 KB','err');return}
    const r=new FileReader();r.onload=()=>{S.settings[el.dataset.logo]=r.result;save();render();toast('Crest updated','ok')};r.readAsDataURL(f);return}
  if(el.closest('#wiz')){collect();if(el.dataset.rr){render()}else{const l=document.getElementById('live');if(l)l.innerHTML=livePanel(D())}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='vcode')ACT.verify();
  if(e.key==='Escape'&&UI.modal){stopScan();UI.modal=null;render()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-dd]'))UI.dd[d.dataset.dd]=d.open},true);
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
