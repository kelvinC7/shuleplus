<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBEA Co., Ltd. — Staff ID Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #1565c0;
        --brand-dark: #0d47a1;
        --ink: #0f172a;
        --muted: #64748b;
        --surface: #f1f5f9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Montserrat, system-ui, sans-serif;
        background: var(--surface);
        color: var(--ink);
        line-height: 1.5;
      }
      body.modal-open {
        overflow: hidden;
      }
      header.page-header {
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
        padding: 1rem 1.5rem;
      }
      header.page-header h1 {
        margin: 0;
        font-size: 1.25rem;
        color: var(--brand);
      }
      header.page-header p {
        margin: 0.35rem 0 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 1.5rem;
        display: grid;
        gap: 1.5rem;
      }
      @media (min-width: 960px) {
        main {
          grid-template-columns: minmax(300px, 360px) 1fr;
          align-items: start;
        }
      }
      .panel {
        background: #fff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        padding: 1.25rem;
      }
      .panel h2 {
        margin: 0 0 1rem;
        font-size: 0.95rem;
      }
      label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        font: inherit;
        padding: 0.5rem 0.65rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        margin-bottom: 0.75rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 0.85rem;
        padding: 0.55rem 1rem;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        background: var(--brand);
        color: #fff;
      }
      button.secondary {
        background: #e2e8f0;
        color: var(--ink);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .staff-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }
      .staff-toolbar span {
        font-size: 0.8rem;
        color: var(--muted);
      }
      #staffList {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 280px;
        overflow: auto;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }
      .staff-empty {
        padding: 1rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .staff-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.65rem 0.75rem;
        border-bottom: 1px solid #f1f5f9;
      }
      .staff-item:last-child {
        border-bottom: none;
      }
      .staff-item-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .staff-item-name {
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .staff-item-meta {
        font-size: 0.72rem;
        color: var(--muted);
      }
      .staff-item-actions {
        display: flex;
        gap: 0.35rem;
        flex-shrink: 0;
      }
      .icon-btn {
        padding: 0.35rem 0.55rem;
        font-size: 0.72rem;
        border-radius: 6px;
        background: #e2e8f0;
        color: var(--ink);
      }
      .icon-btn.danger {
        background: #fee2e2;
        color: #b91c1c;
        font-size: 1rem;
        line-height: 1;
        padding: 0.2rem 0.5rem;
      }
      .hint {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 0 0 1rem;
      }
      .status {
        font-size: 0.8rem;
        color: var(--muted);
        min-height: 1.25rem;
        margin-top: 0.5rem;
      }
      .status.error {
        color: #b91c1c;
      }
      .preview-tabs {
        display: flex;
        gap: 0.35rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      .preview-tabs button.tab {
        background: #e2e8f0;
        color: var(--ink);
        padding: 0.45rem 0.9rem;
        font-size: 0.8rem;
      }
      .preview-tabs button.tab.active {
        background: var(--brand);
        color: #fff;
      }
      .preview-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      #preview {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        align-items: center;
      }
      .sheet-figure {
        margin: 0;
        text-align: center;
        width: 100%;
        max-width: 560px;
      }
      .sheet-preview-canvas {
        width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
        background: #fff;
      }
      .sheet-figure figcaption {
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(4px);
      }
      .modal-backdrop[hidden] {
        display: none;
      }
      .modal-card {
        width: 100%;
        max-width: 440px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.2);
        overflow: hidden;
      }
      .modal-header {
        padding: 1.25rem 1.25rem 0;
      }
      .modal-header h3 {
        margin: 0;
        font-size: 1.1rem;
        color: var(--brand-dark);
      }
      .modal-body {
        padding: 1rem 1.25rem 1.25rem;
      }
      .modal-photo-row {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .modal-photo-row img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #e2e8f0;
        background: #f8fafc;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      .form-grid {
        display: grid;
        gap: 0;
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <h1>TBEA Co., Ltd. — Staff ID Cards</h1>
      <p>
        Add staff via the form · preview on A4 <strong>3×3</strong> sheets (same as PrintCardMIS) · run
        <code>npx serve .</code>
      </p>
    </header>
    <main id="appRoot">
      <section class="panel controls">
        <h2>Company</h2>
        <label for="companyName">Company name</label>
        <input id="companyName" value="TBEA Co., Ltd." />
        <label for="companyPhone">Company phone</label>
        <input id="companyPhone" placeholder="+250 …" />
        <label for="companyEmail">Company email</label>
        <input id="companyEmail" placeholder="info@tbea.com" />
        <label for="website">Website</label>
        <input id="website" placeholder="www.tbea.com" />
        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 1.25rem 0" />
        <div class="staff-toolbar">
          <h2 style="margin: 0">Staff (<span id="staffCount">0</span>)</h2>
          <button type="button" id="btnAddStaff">+ Add staff</button>
        </div>
        <ul id="staffList"></ul>
        <p id="formStatus" class="status" aria-live="polite"></p>
      </section>
      <section class="panel preview-panel">
        <h2>Sheet preview</h2>
        <p class="hint">55 × 87 mm cards · 9 per A4 page · switch front/back for print &amp; export.</p>
        <div class="preview-tabs" role="tablist">
          <button type="button" class="tab active" data-side="front" role="tab" aria-selected="true">
            Front
          </button>
          <button type="button" class="tab" data-side="back" role="tab" aria-selected="false">Back</button>
        </div>
        <div class="preview-toolbar">
          <button type="button" id="btnPrint">Print all (3×3 A4)</button>
          <button type="button" id="btnPngSheets" class="secondary">Download all sheets PNG</button>
          <button type="button" id="btnPngCards" class="secondary">Download each card PNG</button>
          <button type="button" id="btnPng" class="secondary" hidden aria-hidden="true">Download PNG</button>
        </div>
        <div id="preview">
          <p class="hint">Add staff to see 3×3 A4 sheet preview.</p>
        </div>
      </section>
    </main>

    <div id="staffModal" class="modal-backdrop" hidden>
      <div class="modal-card" role="dialog" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h3 id="modalTitle">Add staff</h3>
        </div>
        <form id="staffForm" class="modal-body">
          <div class="modal-photo-row">
            <img id="modalPhotoPreview" alt="" hidden />
            <div style="flex: 1">
              <label for="modalPhoto">Photo</label>
              <input id="modalPhoto" type="file" accept="image/*" />
            </div>
          </div>
          <div class="form-grid">
            <label for="modalFullName">Full name</label>
            <input id="modalFullName" required autocomplete="name" placeholder="Full name" />
            <label for="modalStaffPhone">Staff phone</label>
            <input id="modalStaffPhone" type="tel" autocomplete="tel" placeholder="+250 …" />
            <label for="modalStaffEmail">Staff email</label>
            <input id="modalStaffEmail" type="email" autocomplete="email" placeholder="name@tbea.com" />
            <label for="modalRole">Role</label>
            <input id="modalRole" placeholder="Engineer" />
          </div>
          <div class="modal-actions">
            <button type="button" id="modalCancel" class="secondary">Cancel</button>
            <button type="submit" id="modalSave">Save staff</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module">
      import { createStaffApp } from './tbea-app.js';
      createStaffApp();
    </script>
  </body>
</html>
