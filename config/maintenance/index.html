<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShulePlus — Maintenance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 40px 32px;
      backdrop-filter: blur(8px);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: #fcb038;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 28px;
      color: #0f172a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    p { color: #94a3b8; line-height: 1.6; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(252, 176, 56, 0.15);
      color: #fcb038;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">S+</div>
    <h1>We&rsquo;ll be back soon</h1>
    <p>
      ShulePlus is undergoing scheduled maintenance. The platform is temporarily unavailable
      while we improve your experience.
    </p>
    <p style="margin-top: 16px">Please check back shortly. Thank you for your patience.</p>
    <span class="badge">Maintenance in progress</span>
  </div>
</body>
</html>
