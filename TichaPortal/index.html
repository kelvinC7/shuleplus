body{margin:0}.st-splash{position:relative;min-height:100dvh;background:radial-gradient(120% 70% at 50% 40%,#1B2D52 0,#13213D 55%,#0B1220 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Montserrat,system-ui,sans-serif}
.st-brand{display:flex;flex-direction:column;align-items:center;gap:14px}.st-brand img{width:230px;height:auto}
.st-brand p{margin:0;font-size:11px;font-weight:700;color:#9FB0D3;letter-spacing:2.2px;text-transform:uppercase}
.st-ld{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}.st-ld i{display:block;height:100%;width:40%;background:#F5A623;border-radius:3px;animation:ldbar 1.1s ease-in-out infinite}
@keyframes ldbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
</style></head>
